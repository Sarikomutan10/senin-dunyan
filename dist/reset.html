<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="theme-color" content="#40102b" />
    <title>Senin Dünyan – PIN zurücksetzen</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 1.25rem; color: #fff9f5; background: radial-gradient(circle at 20% 10%, #82335d, transparent 32rem), linear-gradient(145deg, #4a1232, #210615); font-family: Inter, system-ui, sans-serif; }
      main { width: min(100%, 28rem); padding: 2rem; border: 1px solid rgba(255,255,255,.2); border-radius: 1.5rem; background: rgba(255,255,255,.1); box-shadow: 0 2rem 5rem rgba(20,0,12,.3); text-align: center; }
      span { display: grid; place-items: center; width: 4rem; height: 4rem; margin: 0 auto 1rem; border-radius: 1.2rem; color: #4a1232; background: #fff0f4; font: 600 2rem/1 Georgia,serif; }
      h1 { margin: 0 0 .75rem; font: 500 2.2rem/1.05 Georgia,serif; }
      p { margin: 0; color: rgba(255,255,255,.76); line-height: 1.6; }
    </style>
  </head>
  <body>
    <main><span>♡</span><h1>PIN wird zurückgesetzt …</h1><p>Es dauert nur einen Moment. Danach kannst du einen neuen PIN festlegen.</p></main>
    <script>
      (async () => {
        localStorage.removeItem("senin-dunyan-vault-v1");
        localStorage.removeItem("senin-dunyan-vault-v2");
        localStorage.removeItem("senin-dunyan-vault-v3");
        sessionStorage.clear();
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith("senin-dunyan-")).map((key) => caches.delete(key)));
        }
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        location.replace("./?pin-reset=fixed-21092001-v10");
      })().catch(() => location.replace("./?pin-reset=fixed-21092001-v10"));
    </script>
  </body>
</html>
